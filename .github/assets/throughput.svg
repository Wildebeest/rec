 <title id="title">Flint decode throughput: rec versus llama.cpp on Apple M4 Pro</title><desc id="description">Measured tokens per second at 1K through 252K input tokens, shown on a log context axis. rec: 131.2 to 22.6 tok/s; llama.cpp: 88.0 to 8.6 tok/s. 48 GiB, 4-bit weights, five repeats, 1024 output steps, prefill excluded.</desc><style>
